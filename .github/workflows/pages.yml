name: Publish public support pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check published contact information
        run: |
          if grep -rn 'SUPPORT_EMAIL' mealcal/; then exit 1; fi
          grep -q 'mailto:michaelyu230513@gmail.com' mealcal/privacy.html
          grep -q 'mailto:michaelyu230513@gmail.com' mealcal/support.html
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R mealcal _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
